<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Place Between</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void: #050810;
      --deep: #0a0f1e;
      --mist: #8fa0bf;
      --glow: #c8d8f0;
      --ghost: rgba(200, 216, 240, 0.08);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--void);
      color: var(--glow);
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    /* Starfield */
    canvas#stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.6;
    }

    /* Radial atmosphere */
    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 60% 50% at 50% 60%, rgba(30, 60, 120, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 100% 80% at 50% 100%, rgba(10, 20, 60, 0.5) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Globe placeholder */
    .globe-wrap {
      position: fixed;
      left: 50%; top: 55%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .globe {
      width: 360px; height: 360px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, rgba(80, 120, 200, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 65% 70%, rgba(20, 40, 100, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #0d1530 0%, #050810 100%);
      border: 1px solid rgba(200, 216, 240, 0.1);
      box-shadow:
        0 0 80px rgba(100, 140, 220, 0.08),
        0 0 200px rgba(60, 100, 180, 0.05),
        inset 0 0 60px rgba(0, 0, 0, 0.6);
      position: relative;
      animation: breathe 8s ease-in-out infinite;
    }

    .globe::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(200, 216, 240, 0.04) 25%,
        transparent 50%,
        rgba(200, 216, 240, 0.02) 75%,
        transparent 100%
      );
      animation: rotate 40s linear infinite;
    }

    /* Grid lines on globe */
    .globe-grid {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      opacity: 0.12;
    }

    .globe-grid svg {
      width: 100%; height: 100%;
    }

    /* Meridian shimmer */
    .globe::after {
      content: '';
      position: absolute;
      top: 8%; left: 20%;
      width: 25%; height: 35%;
      background: radial-gradient(ellipse, rgba(200, 220, 255, 0.07) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
    }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 80px rgba(100,140,220,0.08), 0 0 200px rgba(60,100,180,0.05), inset 0 0 60px rgba(0,0,0,0.6); }
      50% { box-shadow: 0 0 120px rgba(100,140,220,0.14), 0 0 280px rgba(60,100,180,0.09), inset 0 0 60px rgba(0,0,0,0.6); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* UI layer */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .wordmark {
      margin-top: 52px;
      text-align: center;
      animation: fadeIn 3s ease forwards;
      opacity: 0;
    }

    .wordmark h1 {
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--glow);
      line-height: 1;
    }

    .wordmark .rule {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 14px;
      justify-content: center;
    }

    .wordmark .rule::before,
    .wordmark .rule::after {
      content: '';
      display: block;
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,216,240,0.3), transparent);
    }

    .wordmark .tagline {
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--mist);
      text-transform: uppercase;
      opacity: 0.6;
    }

    .loading-wrap {
      position: absolute;
      bottom: 52px;
      text-align: center;
      animation: fadeIn 4s 1s ease forwards;
      opacity: 0;
    }

    .loading-label {
      font-family: 'Inconsolata', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--mist);
      opacity: 0.4;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 120px;
      height: 1px;
      background: rgba(200, 216, 240, 0.1);
      margin: 0 auto;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, transparent, var(--mist), transparent);
      animation: load 6s 1.5s ease-in-out forwards;
    }

    @keyframes load {
      0% { width: 0%; opacity: 0.4; }
      60% { width: 75%; opacity: 0.7; }
      90% { width: 90%; opacity: 0.5; }
      100% { width: 100%; opacity: 0.8; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Coordinates readout */
    .coords {
      position: fixed;
      bottom: 52px;
      right: 40px;
      z-index: 10;
      font-family: 'Inconsolata', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: var(--mist);
      opacity: 0.25;
      line-height: 1.8;
      text-align: right;
      animation: fadeIn 5s 2s ease forwards;
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="atmosphere"></div>

  <div class="globe-wrap">
    <div class="globe">
      <div class="globe-grid">
        <svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
          <!-- Latitude lines -->
          <ellipse cx="180" cy="180" rx="175" ry="30" fill="none" stroke="white" stroke-width="0.5"/>
          <ellipse cx="180" cy="180" rx="175" ry="80" fill="none" stroke="white" stroke-width="0.5"/>
          <ellipse cx="180" cy="180" rx="175" ry="140" fill="none" stroke="white" stroke-width="0.5"/>
          <line x1="5" y1="180" x2="355" y2="180" stroke="white" stroke-width="0.5"/>
          <!-- Longitude lines -->
          <ellipse cx="180" cy="180" rx="30" ry="175" fill="none" stroke="white" stroke-width="0.5"/>
          <ellipse cx="180" cy="180" rx="80" ry="175" fill="none" stroke="white" stroke-width="0.5"/>
          <ellipse cx="180" cy="180" rx="140" ry="175" fill="none" stroke="white" stroke-width="0.5"/>
          <line x1="180" y1="5" x2="180" y2="355" stroke="white" stroke-width="0.5"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="ui">
    <div class="wordmark">
      <h1>The Place Between</h1>
      <div class="rule">
        <span class="tagline">arriving soon</span>
      </div>
    </div>
    <div class="loading-wrap">
      <div class="loading-label">initializing</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>
  </div>

  <div class="coords">
    <div id="lat">0.0000° N</div>
    <div id="lng">0.0000° E</div>
    <div id="alt">ALT 0km</div>
  </div>

  <script>
    // Starfield
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = Array.from({ length: 280 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2,
        a: Math.random(),
        speed: Math.random() * 0.003 + 0.001
      }));
    }

    function drawStars() {
      ctx.clearRect(0, 0, W, H);
      stars.forEach(s => {
        s.a += s.speed;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 220, 255, ${0.2 + Math.sin(s.a) * 0.3})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }

    resize();
    initStars();
    drawStars();
    window.addEventListener('resize', () => { resize(); initStars(); });

    // Drifting coordinates readout
    let lat = 0, lng = 0, alt = 0;
    setInterval(() => {
      lat += (Math.random() - 0.5) * 0.8;
      lng += (Math.random() - 0.5) * 0.8;
      alt += (Math.random() - 0.5) * 20;
      document.getElementById('lat').textContent = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}`;
      document.getElementById('lng').textContent = `${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
      document.getElementById('alt').textContent = `ALT ${Math.max(0, Math.round(alt))}km`;
    }, 1800);
  </script>
</body>
</html>
